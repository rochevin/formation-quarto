project:
  type: website
  title: "Rédaction de documents en Rmarkdown et Quarto"
  output-dir: docs
  execute-dir: project
  render:
    - "*.qmd"

website:
  title: "Formation Quarto"
  navbar:
    right:
      - icon: house
        href: index.qmd
        text: Home
      - icon: book
        href: https://genotoul-biostat.pages.mia.inra.fr/website/
        text: Plateforme de Biostatistique Toulouse - Génotoul
      - icon: gitlab
        href: https://forge.inrae.fr/genotoul-biostat/formation-quarto
        aria-label: GitLab
        text: Dépôt du code source
  sidebar:
    style: "docked"
    search: true
    contents: auto
    reader-mode: true

  page-footer:
    left: "Formation Quarto"


execute:
  echo: true
  warning: false
  message: false
  freeze: auto


resources:
  - "Resources/*"
